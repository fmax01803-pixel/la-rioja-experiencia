<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Rioja - Experiencia Única</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fff; overflow: hidden; }

        /* Preloader canvas */
        #preloaderCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; }

        /* Cursor */
        #cursor { position: fixed; top: -100%; left: -100%; width: 20px; height: 20px; background: rgba(249, 168, 37, 0.5); border-radius: 50%; pointer-events: none; z-index: 10000; opacity: 0; transition: opacity 0.3s ease; }
        #cursor.show { opacity: 1; }

        /* Background video */
        .background { position: absolute; top: 50%; left: 50%; width: 100vw; height: 100vh; transform: translate(-50%, -50%); z-index: -2; opacity: 0; transition: opacity 1.8s ease-in; overflow: hidden; }
        .video-container { position: absolute; top: 50%; left: 50%; width: 120%; height: 120%; transform: translate(-50%, -50%) scale(1); animation: subtleZoom 20s ease-in-out infinite alternate; }
        @keyframes subtleZoom { 0% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(-50%, -50%) scale(1.05); } }
        .video-container iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(10, 10, 10, 0.15), rgba(10, 10, 10, 0.75)); opacity: 0; transition: opacity 1.8s ease-in; z-index: -1; }

        /* Hero */
        .hero { text-align: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity 1.5s ease; width: 80%; max-width: 800px; }
        .title { font-family: 'Playfair Display', serif; font-size: 56px; font-weight: 600; margin-bottom: 20px; letter-spacing: 1.5px; opacity: 0; transform: translateY(-40px) scale(0.95); transition: all 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); }
        .subtitle { font-size: 22px; font-weight: 300; margin-bottom: 45px; opacity: 0; transform: translateY(40px) scale(0.95); transition: all 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }

        /* Botón */
        .btn { position: relative; width: 320px; height: 62px; overflow: hidden; border-radius: 31px; border: 2px solid #f9a825; background: transparent; color: #fff; font-weight: 600; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 15px rgba(249, 168, 37, 0.25); transition: transform .4s ease, box-shadow .4s ease; opacity: 0; transform: translateY(20px); animation: btnAppear 1.5s ease forwards 1.2s; }
        @keyframes btnAppear { to { opacity: 1; transform: translateY(0); } }
        .btn:hover { transform: scale(1.05); box-shadow: 0 8px 20px rgba(249, 168, 37, 0.45); }
        .btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, rgba(249, 168, 37, 0.2), rgba(249, 168, 37, 0.6), rgba(249, 168, 37, 0.2)); animation: shine 3s infinite; }
        @keyframes shine { 0% { left: -100%; } 50% { left: 100%; } 100% { left: 100%; } }
        .typing { white-space: nowrap; letter-spacing: 0.5px; }
        .cursor { margin-left: 2px; }
        .blink { animation: blink .8s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Social icons */
        .social-icons { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; opacity: 0; transition: opacity 1.8s ease; }
        .social-icons a { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(6px); color: #fff; font-size: 22px; transition: all .4s ease; opacity: 0; transform: translateY(20px); }
        .social-icons a:nth-child(1) { animation: iconAppear 0.8s ease forwards 1.8s; }
        .social-icons a:nth-child(2) { animation: iconAppear 0.8s ease forwards 2.0s; }
        .social-icons a:nth-child(3) { animation: iconAppear 0.8s ease forwards 2.2s; }
        @keyframes iconAppear { to { opacity: 1; transform: translateY(0); } }
        .social-icons a:hover { color: #f9a825; background: rgba(249, 168, 37, 0.15); transform: scale(1.2); }

        /* Audio prompt */
        .audio-prompt { position: fixed; top: 20px; right: 20px; width: auto; padding: 15px 25px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); border-radius: 10px; z-index: 2000; display: flex; align-items: center; gap: 15px; opacity: 0; pointer-events: none; transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out; transform: translateY(-20px); }
        .audio-prompt.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .audio-prompt p { font-size: 16px; font-weight: 600; color: #fff; margin: 0; }
        .audio-prompt .audio-btn { padding: 8px 20px; font-size: 14px; font-weight: 600; border: 2px solid #f9a825; border-radius: 20px; background: rgba(249, 168, 37, 0.2); color: #f9a825; cursor: pointer; transition: all 0.3s ease; }
        .audio-prompt .audio-btn:hover { background: rgba(249, 168, 37, 0.4); transform: scale(1.05); }
        .audio-prompt .audio-btn.no { border-color: #ccc; background: rgba(255, 255, 255, 0.1); color: #ccc; }
        .audio-prompt .audio-btn.no:hover { background: rgba(255, 255, 255, 0.2); }

        /* Responsivo */
        @media (max-width: 768px) { 
            .title { font-size: 38px; } 
            .subtitle { font-size: 18px; } 
            .btn { width: 260px; height: 52px; font-size: 16px; } 
            .social-icons a { width: 40px; height: 40px; font-size: 20px; } 
            .audio-prompt { padding: 10px 15px; } 
            .audio-prompt p { font-size: 14px; } 
            .audio-prompt .audio-btn { padding: 6px 15px; font-size: 12px; }
        }
        @media (max-width: 480px) { 
            .title { font-size: 32px; } 
            .subtitle { font-size: 16px; } 
            .btn { width: 220px; height: 48px; font-size: 14px; } 
            .social-icons { gap: 20px; bottom: 20px; } 
            .audio-prompt { top: 10px; right: 10px; }
        }
    </style>
</head>
<body>

    <!-- Preloader canvas -->
    <canvas id="preloaderCanvas"></canvas>

    <!-- Cursor -->
    <div id="cursor"></div>

    <!-- Fondo video -->
    <div class="background">
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/5BdopU94zLE?autoplay=1&mute=1&loop=1&playlist=5BdopU94zLE&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1&fs=0&playsinline=1"></iframe>
        </div>
    </div>
    <div class="overlay"></div>

    <audio id="background-music" src="https://www.bensound.com/bensound-music/bensound-anewbeginning.mp3" loop volume="0.5"></audio>

    <div class="hero">
        <h1 class="title">Descubre La Rioja</h1>
        <p class="subtitle">Vinos, cultura y paisajes que inspiran</p>
        <button class="btn"><span class="typing"></span></button>
    </div>
    <div class="social-icons">
        <a href="https://twitter.com/larioja" target="_blank"><i class="fab fa-twitter"></i></a>
        <a href="https://facebook.com/larioja" target="_blank"><i class="fab fa-facebook-f"></i></a>
        <a href="https://instagram.com/larioja" target="_blank"><i class="fab fa-instagram"></i></a>
    </div>
    <div class="audio-prompt">
        <p>¿Activar sonido?</p>
        <button class="audio-btn yes">Sí</button>
        <button class="audio-btn no">No</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        const canvas = document.getElementById("preloaderCanvas");
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;

        const torus = new THREE.Mesh(new THREE.TorusGeometry(5, 1, 30, 100), new THREE.MeshBasicMaterial({ color: 0x8B0000, wireframe: true }));
        scene.add(torus);

        const particleCount = 5000;
        const positions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 50;
            positions[i + 1] = (Math.random() - 0.5) * 50;
            positions[i + 2] = (Math.random() - 0.5) * 50;
        }
        const particlesGeometry = new THREE.BufferGeometry();
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMaterial = new THREE.PointsMaterial({ color: 0xDC143C, size: 0.2, transparent: true, opacity: 0.8 });
        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        const pointLight = new THREE.PointLight(0xFF1493, 1, 100);
        pointLight.position.set(0, 0, 10);
        scene.add(pointLight);

        let mouseX = 0, mouseY = 0;
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            mouseX = (e.clientX - window.innerWidth / 2) / window.innerWidth;
            mouseY = (e.clientY - window.innerHeight / 2) / window.innerHeight;
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.style.transform = `scale(${1 + Math.abs(mouseX + mouseY)})`;
            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < pos.length; i += 3) {
                pos[i] += (mouseX * 20 - pos[i]) * 0.001;
                pos[i + 1] += (mouseY * 20 - pos[i + 1]) * 0.001;
            }
            particles.geometry.attributes.position.needsUpdate = true;
        });

        let isExploding = false;
        function animate() {
            requestAnimationFrame(animate);
            torus.rotation.x += 0.01 + (isExploding ? 0.02 : 0);
            torus.rotation.y += 0.01 + (isExploding ? 0.02 : 0);
            particles.rotation.y += 0.002 + mouseX * 0.001 + (isExploding ? 0.008 : 0);
            particles.rotation.x += mouseY * 0.001;
            pointLight.intensity = 1 + Math.sin(Date.now() * 0.005) * 0.5;
            renderer.render(scene, camera);
        }
        animate();

        // Preloader duración 3s
        setTimeout(() => {
            isExploding = true;
            gsap.to(particlesMaterial, { opacity: 0, duration: 1.5 });
            gsap.to(torus.scale, { x: 2, y: 2, z: 2, duration: 1.5, ease: "back.inOut(1.7)" });
            gsap.to(renderer.domElement, { opacity: 0, duration: 1.5, delay: 1.2, onComplete: () => {
                renderer.domElement.style.display = "none";
                // Mostrar elementos principales
                document.querySelector('.background').style.opacity = '1';
                document.querySelector('.overlay').style.opacity = '1';
                const hero = document.querySelector('.hero');
                hero.style.opacity = '1';
                setTimeout(() => {
                    document.querySelector('.title').style.opacity = '1';
                    document.querySelector('.title').style.transform = 'translateY(0) scale(1)';
                    document.querySelector('.subtitle').style.opacity = '1';
                    document.querySelector('.subtitle').style.transform = 'translateY(0) scale(1)';
                    startTyping();
                    document.querySelector('.social-icons').style.opacity = '1';
                    cursor.classList.add('show');
                }, 700);
            } });
            gsap.to(cursor, { opacity: 0, duration: 1.5 });
        }, 3000);

        function startTyping() {
            const text = 'Conocer La Rioja';
            const typingSpan = document.querySelector('.typing');
            let i = 0;
            function typeWriter() {
                if (i < text.length) {
                    typingSpan.innerHTML = text.substring(0, i + 1) + '<span class="cursor blink">|</span>';
                    i++;
                    setTimeout(typeWriter, 120);
                } else { setTimeout(erase, 2800); }
            }
            function erase() {
                let j = text.length;
                function doErase() {
                    if (j > 0) {
                        typingSpan.innerHTML = text.substring(0, j - 1) + '<span class="cursor blink">|</span>';
                        j--;
                        setTimeout(doErase, 70);
                    } else {
                        typingSpan.innerHTML = '<span class="cursor blink">|</span>';
                        setTimeout(() => { i = 0; typeWriter(); }, 700);
                    }
                }
                doErase();
            }
            typeWriter();
        }

        // Manejo audio
        const music = document.getElementById('background-music');
        const audioPrompt = document.querySelector('.audio-prompt');
        const yesBtn = document.querySelector('.audio-btn.yes');
        const noBtn = document.querySelector('.audio-btn.no');
        window.addEventListener('load', () => {
            music.play().catch(() => {
                audioPrompt.classList.add('show');
                yesBtn.addEventListener('click', () => { music.play(); audioPrompt.classList.remove('show'); }, { once: true });
                noBtn.addEventListener('click', () => { audioPrompt.classList.remove('show'); }, { once: true });
            });
        });

        // Botón click
        const btn = document.querySelector('.btn');
        btn.addEventListener('click', () => {
            btn.style.pointerEvents = "none";
            btn.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(0.92)' },
                { transform: 'scale(1.05)' },
                { transform: 'scale(1)' }
            ], { duration: 650, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' }).onfinish = () => {
                window.location.href = 'https://sobrevuelotml.blogspot.com/';
            };
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
